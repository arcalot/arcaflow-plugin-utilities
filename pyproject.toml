[tool.poetry]
name = "arcaflow-plugin-utilities"
version = "0.2.0"
description = "Arcaflow utilities plugin"
authors = ["Arcalot"]
license = "Apache-2.0+GPL-2.0-only"
readme = "README.md"

packages = [
   { include="arcaflow_plugin_utilities.py", from="./arcaflow_plugin_utilities"  },
]

[tool.poetry.dependencies]
python = "^3.9"
arcaflow-plugin-sdk = "^0.14.0"

[tool.poetry.dev-dependencies]
docformatter = "1.7.5"
autoflake = "2.3.1"
black = "24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
